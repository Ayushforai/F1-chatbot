# Local production-shaped run for Racecoe.
# Usage:
#   cp .env.example .env   # set GEMINI_API_KEY + HF_TOKEN
#   docker compose up --build
#
# Optional Postgres (feature/db):
#   docker compose --profile db up --build
#   python scripts/load_ergast_to_postgres.py
# Then set HISTORICAL_BACKEND=postgres and SESSION_STORE=postgres.

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["db"]
    environment:
      POSTGRES_USER: racecoe
      POSTGRES_PASSWORD: racecoe
      POSTGRES_DB: racecoe
    ports:
      - "5432:5432"
    volumes:
      - racecoe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racecoe -d racecoe"]
      interval: 5s
      timeout: 5s
      retries: 10

  racecoe:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.8-flash
      GEMINI_THINKING_LEVEL: LOW
      F1_SKIP_WARMUP: ${F1_SKIP_WARMUP:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      HF_TOKEN: ${HF_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAG_WARMUP_CATEGORIES: ${RAG_WARMUP_CATEGORIES:-}
      DATABASE_URL: ${DATABASE_URL:-}
      HISTORICAL_BACKEND: ${HISTORICAL_BACKEND:-auto}
      SESSION_STORE: ${SESSION_STORE:-auto}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  racecoe_pgdata:
