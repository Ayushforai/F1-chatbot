# Render Blueprint — Docker web service + PostgreSQL.
# https://render.com/docs/blueprint-spec
#
# Before deploy:
# 1. Create GEMINI_API_KEY at https://aistudio.google.com/apikey
# 2. Create HF_TOKEN at https://huggingface.co/settings/tokens
# 3. In Render dashboard, set those as secret env vars (or fill below as sync:false)
#
# First deploy applies db/schema.sql and loads historical CSVs into Postgres
# (scripts/start_web.py). Later deploys skip the load if f1.races already has rows.
#
# Free (512MB) web instances cannot hold torch + bge-base at once. Stay on
# F1_SKIP_WARMUP=1; upgrade the web service to Standard (2GB) for full RAG warmup.
# Postgres is a paid Render database (no free-tier DB).

databases:
  - name: racecoe-db
    databaseName: racecoe
    user: racecoe
    postgresMajorVersion: "16"

services:
  - type: web
    name: racecoe
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_THINKING_LEVEL
        value: LOW
      - key: HOST
        value: 0.0.0.0
      - key: F1_SKIP_WARMUP
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: RAG_WARMUP_CATEGORIES
        value: historical,sporting,financial
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: racecoe-db
          property: connectionString
      - key: HISTORICAL_BACKEND
        value: postgres
      - key: SESSION_STORE
        value: postgres
