# Render Blueprint — deploy Racecoe as a single Docker web service.
# https://render.com/docs/blueprint-spec
#
# Before deploy:
# 1. Create GEMINI_API_KEY at https://aistudio.google.com/apikey
# 2. Create HF_TOKEN at https://huggingface.co/settings/tokens
# 3. In Render dashboard, set those as secret env vars (or fill below as sync:false)
#
# Image includes data/historical_csvs + vector_store FAISS indexes from the repo.
# Free (512MB) OOMs loading torch + bge-base embeddings — use Standard (2GB).

services:
  - type: web
    name: racecoe
    runtime: docker
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_THINKING_LEVEL
        value: LOW
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT; keep HOST=0.0.0.0 so uvicorn binds correctly.
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: RAG_WARMUP_CATEGORIES
        value: historical,sporting,financial
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
